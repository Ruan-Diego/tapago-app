name: Deploy

# Publica a web (Hosting) e as regras do Firestore a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Config pública do app web: GitHub → Settings → Secrets and variables → Actions → Variables.
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_USE_EMULATOR: 'false'
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      # TODO(humano): HUM-05 — sem o segredo e as variáveis, o deploy é pulado com um aviso.
      - name: Conferir configuração
        id: config
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy pulado: configure FIREBASE_SERVICE_ACCOUNT e as variáveis EXPO_PUBLIC_* (HUM-05)."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.pronto == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.pronto == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.pronto == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        if: steps.config.outputs.pronto == 'true'
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
        if: steps.config.outputs.pronto == 'true'
      # Regras só são publicadas depois de passarem no emulador.
      - run: pnpm test:rules
        if: steps.config.outputs.pronto == 'true'
      - run: pnpm build
        if: steps.config.outputs.pronto == 'true'
      - name: Publicar
        if: steps.config.outputs.pronto == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            pnpm exec firebase deploy --only hosting,firestore --project tapago-51ecc --non-interactive
