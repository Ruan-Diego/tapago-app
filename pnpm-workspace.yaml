packages:
  - apps/*
  - packages/*
  - firebase

# Layout plano: evita caminhos longos no build Android (Windows) e problemas de autolinking.
minimumReleaseAgeExclude:
  - '@react-native-firebase/app@27.2.0'
  - '@react-native-firebase/auth@27.2.0'
  - '@react-native-firebase/crashlytics@27.2.0'
  - '@react-native-firebase/firestore@27.2.0'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
  - '@expo/config-plugins@58.0.14'
  - expo-sharing@58.0.24

nodeLinker: hoisted

# Scripts de instalação desnecessários aqui (a config do Firebase vem do .env).
allowBuilds:
  '@firebase/util': false
  protobufjs: false
  # Dependência opcional do firebase-tools; sem ela, o Hosting local usa o RegExp do Node.
  re2: false
